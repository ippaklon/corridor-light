# CorridorLight agent config. Pair with a file in configs/maps/.
# Map files win on reward_fn and lambda_friction_coeff.
# Field-level documentation is on CorridorLight.config.Config.
agent_type: corridor
# Training
max_episodes: 400
num_threads: 4
save_dir: models
device: auto  # Use CUDA if available.
profile_timing: true

# Checkpoints
checkpoint_interval: 20  # 0 disables checkpoints.
checkpoint_save_dir: checkpoints
checkpoint_save_models: true
checkpoint_save_training_state: true

# Evaluation
eval_episodes: 5

# Corridor controls
disable_corridor_agent: false  # Use local-only training when true.
disable_gnn: false  # Use standard observations only when true.
max_corridors: 6
max_corridor_length: 5
seed_top_k: 16
corridor_reward_decay: 0.9
corridor_delta_time: 20
# If false, require at least two lanes.
allow_single_lane_corridor: false
corridor_entropy_coef: 0.01
corridor_immediate_stop_penalty: 0.05

# Reward table logging
reward_log_window: 100
reward_log_flush_partial: true
# Global reward mode
# - corridor_only: corridor bonus only
# - shaping: local reward + corridor bonus
# - same_as_loc: global reward equals local reward
reward_glob_mode: corridor_only

# GNN
gnn_hidden_dim: 128
gnn_output_dim: 64
gnn_num_layers: 3
gnn_architecture: GAT
seed_projection_dim: 64

# Intersection Agent
hidden_dim: 128
lambda_max_initial: 0.5  # Initial lambda cap.
lane_feature_dim: 10
# Optional grow Q feature for the global critic.
include_grow_q_in_global_critic: false
corridor_q_reduce: mean                # max | mean | sum



# PPO/MGDA
ppo_lr: 3e-4
ppo_gamma: 0.99
ppo_clip_ratio: 0.15
ppo_value_coef: 0.5
ppo_entropy_coef: 0.01
ppo_max_grad_norm: 0.5
ppo_epochs: 10
ppo_lam: 0.95
mgda_epsilon: 1e-8

